<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajedrez Multijugador en Línea</title>
    <link rel="stylesheet" href="index.css">
</head>
<body class="room-lobby">
    <main class="room-lobby-shell">
        <nav class="room-switcher" aria-label="Partidas abiertas" role="tablist">
            <button class="room-tab active" id="room-tab-1" data-room-tab="1" role="tab" aria-selected="true">Partida 1</button>
            <button class="room-tab" id="room-tab-2" data-room-tab="2" role="tab" aria-selected="false">Partida 2</button>
            <button class="room-tab" id="room-tab-3" data-room-tab="3" role="tab" aria-selected="false">Partida 3</button>
        </nav>
        <section class="room-stage">
            <iframe class="room-frame" data-room-frame="1" title="Partida 1" src="game.html?modern=1&amp;room=room-1"></iframe>
            <iframe class="room-frame" data-room-frame="2" title="Partida 2" src="game.html?modern=1&amp;room=room-2" hidden></iframe>
            <iframe class="room-frame" data-room-frame="3" title="Partida 3" src="game.html?modern=1&amp;room=room-3" hidden></iframe>
        </section>
    </main>
    <script src="rooms.js"></script>
</body>
</html>
