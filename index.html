<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajedrez Premium - Arena Pro</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="game-container">
        <div class="board-wrapper">
            <div id="chessboard"></div>
        </div>

        <div class="sidebar">
            <div id="elo-panel">
                <div class="player-card white-player">
                    <span class="avatar">⬜</span>
                    <div class="player-info">
                        <span class="name">Blancas</span>
                        <span class="elo-tag" id="elo-white">1000</span>
                    </div>
                </div>
                <div class="player-divider">VS</div>
                <div class="player-card black-player">
                    <span class="avatar">⬛</span>
                    <div class="player-info">
                        <span class="name">Negras</span>
                        <span class="elo-tag" id="elo-black">1000</span>
                    </div>
                </div>
            </div>
            
            <div id="turn-indicator">Estableciendo conexión...</div>

            <div class="tabs-container">
                <button id="tab-moves-btn" class="tab-btn active" onclick="switchTab('moves')">Jugadas</button>
                <button id="tab-history-btn" class="tab-btn" onclick="switchTab('history')">Historial</button>
            </div>

            <div class="tab-content-wrapper">
                <div id="tab-moves" class="tab-pane active">
                    <div id="moves-log"></div>
                </div>

                <div id="tab-history" class="tab-pane">
                    <div id="games-history-log"></div>
                </div>
            </div>

            <div class="action-buttons-container">
                <button id="draw-btn" class="action-btn draw" disabled>Ofrecer Tablas</button>
                <button id="resign-btn" class="action-btn resign" disabled>Rendirse</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
